name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  native:
    name: C++17 native runtime
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/native --parallel

      - name: Test
        run: ctest --test-dir build/native --output-on-failure

      - name: Smoke benchmark
        run: ./build/native/edgegenbench_benchmark --runs 100

  android:
    name: Android debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned native toolchain
        run: sdkmanager "platforms;android-35" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build and test Android harness
        working-directory: android
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug --stacktrace

      - name: Verify Android 16 KiB page compatibility
        run: |
          scripts/verify_android_16kb_alignment.sh \
            android/app/build/outputs/apk/debug/app-debug.apk \
            "$ANDROID_SDK_ROOT/ndk/27.0.12077973"

      - name: Name verified 16 KiB-compatible APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            android/app/build/outputs/apk/debug/EdgeGenBench-0.1.2-16kb-visible-ui-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: EdgeGenBench-0.1.2-16kb-visible-ui-apk
          path: android/app/build/outputs/apk/debug/EdgeGenBench-0.1.2-16kb-visible-ui-debug.apk
          if-no-files-found: error

  test:
    name: Python 3.12 checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install project
        run: |
          python -m pip install -e ".[dev,edge,neural]"

      - name: Check formatting
        run: |
          ruff format --check .

      - name: Run lint checks
        run: |
          ruff check .

      - name: Run type checks
        run: |
          mypy src/edgegenbench/deployment/neural_int8.py
          mypy src/edgegenbench/deployment/neural_int8_benchmark.py
          mypy src/edgegenbench/cli.py
          mypy src/edgegenbench/deployment/qualcomm_ai_hub.py

      - name: Run tests
        run: |
          pytest -q

      - name: Revalidate tracked Qualcomm INT8 decision
        run: |
          python scripts/validate_tracked_qualcomm_int8.py
