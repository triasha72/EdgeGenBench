name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  native:
    name: C++17 native runtime
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/native --parallel

      - name: Test
        run: ctest --test-dir build/native --output-on-failure

      - name: Run native end-to-end acceptance benchmarks
        run: |
          mkdir -p build/evidence/native
          ./build/native/edgegenbench_benchmark --runs 100 --baseline-preprocess > build/evidence/native/baseline.json
          ./build/native/edgegenbench_benchmark --runs 100 > build/evidence/native/fused.json

      - name: Upload native runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: native-runtime-evidence
          path: build/evidence/native
          if-no-files-found: error

  android:
    name: Android debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned native toolchain
        run: sdkmanager "platforms;android-35" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build and test Android harness
        working-directory: android
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug --stacktrace

      - name: Verify Android 16 KiB page compatibility
        run: |
          mkdir -p build/evidence/android
          scripts/verify_android_16kb_alignment.sh \
            android/app/build/outputs/apk/debug/app-debug.apk \
            "$ANDROID_SDK_ROOT/ndk/27.0.12077973" \
            | tee build/evidence/android/16kb-alignment.txt

      - name: Name verified 16 KiB-compatible APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            android/app/build/outputs/apk/debug/EdgeGenBench-0.1.7-device-evidence-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: EdgeGenBench-0.1.7-device-evidence-apk
          path: android/app/build/outputs/apk/debug/EdgeGenBench-0.1.7-device-evidence-debug.apk
          if-no-files-found: error

      - name: Upload Android verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: android-verification-evidence
          path: build/evidence/android
          if-no-files-found: error

  ios:
    name: iOS Core ML simulator
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Core ML export dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[neural,coreml]"

      - name: Export current model and stage iOS resources
        run: python scripts/prepare_ios_resources.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned iOS simulator app
        working-directory: ios
        run: |
          xcodebuild \
            -project EdgeGenBenchDemo.xcodeproj \
            -scheme EdgeGenBenchDemo \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run XCTest on an available iPhone simulator
        working-directory: ios
        run: |
          DEVICE_ID="$(xcrun simctl list devices available -j | python -c \
            'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for values in d.values() for x in values if x["name"].startswith("iPhone")))')"
          xcodebuild \
            -project EdgeGenBenchDemo.xcodeproj \
            -scheme EdgeGenBenchDemo \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath DerivedData \
            -resultBundlePath ../build/ios-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Package simulator acceptance evidence
        run: |
          mkdir -p build/ios-evidence
          ditto -c -k --sequesterRsrc --keepParent \
            ios/DerivedData/Build/Products/Debug-iphonesimulator/EdgeGenBenchDemo.app \
            build/ios-evidence/EdgeGenBench-ios-simulator-app.zip
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios-tests.xcresult \
            build/ios-evidence/ios-tests.xcresult.zip
          xcodebuild -version > build/ios-evidence/xcode-version.txt
          shasum -a 256 build/ios-evidence/* > build/ios-evidence/checksums.txt

      - name: Upload iOS simulator evidence
        uses: actions/upload-artifact@v4
        with:
          name: ios-coreml-simulator-evidence
          path: build/ios-evidence
          if-no-files-found: error

  test:
    name: Python 3.12 checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install project
        run: |
          python -m pip install -e ".[dev,edge,neural]"

      - name: Check formatting
        run: |
          ruff format --check .

      - name: Run lint checks
        run: |
          ruff check .

      - name: Run type checks
        run: |
          mypy src/edgegenbench/deployment/neural_int8.py
          mypy src/edgegenbench/deployment/neural_int8_benchmark.py
          mypy src/edgegenbench/cli.py
          mypy src/edgegenbench/deployment/qualcomm_ai_hub.py

      - name: Run tests
        run: |
          pytest -q

      - name: Revalidate tracked Qualcomm INT8 decision
        run: |
          python scripts/validate_tracked_qualcomm_int8.py

      - name: Build cross-runtime portfolio acceptance matrix
        run: |
          python scripts/build_portfolio_acceptance.py \
            --output-json /tmp/portfolio-acceptance.json \
            --output-markdown /tmp/portfolio-acceptance.md

      - name: Revalidate real DASHlink release decision
        run: |
          python scripts/assess_dashlink_release.py \
            artifacts/dashlink_real_baseline_v1.json \
            /tmp/dashlink_release_assessment.json
          diff -u artifacts/dashlink_release_assessment_v1.json \
            /tmp/dashlink_release_assessment.json

  release-acceptance:
    name: End-to-end release acceptance
    runs-on: ubuntu-latest
    needs: [native, android, ios, test]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download native evidence
        uses: actions/download-artifact@v4
        with:
          name: native-runtime-evidence
          path: build/input/native

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: EdgeGenBench-0.1.7-device-evidence-apk
          path: build/input/android

      - name: Download Android verification evidence
        uses: actions/download-artifact@v4
        with:
          name: android-verification-evidence
          path: build/input/android

      - name: Download iOS simulator evidence
        uses: actions/download-artifact@v4
        with:
          name: ios-coreml-simulator-evidence
          path: build/input/ios

      - name: Validate and assemble release evidence
        run: |
          python scripts/build_release_evidence.py \
            --baseline build/input/native/baseline.json \
            --fused build/input/native/fused.json \
            --apk build/input/android/EdgeGenBench-0.1.7-device-evidence-debug.apk \
            --alignment-report build/input/android/16kb-alignment.txt \
            --ios-simulator-evidence build/input/ios \
            --output-dir build/release-evidence \
            --git-revision "$GITHUB_SHA" \
            --version 0.1.7

      - name: Upload complete release evidence
        uses: actions/upload-artifact@v4
        with:
          name: EdgeGenBench-0.1.7-release-evidence
          path: build/release-evidence
          if-no-files-found: error
