name: Deploy browser demo

on:
  push:
    branches: [main]
    paths: ["web/**", "artifacts/neural_onnx/neural_surrogate.onnx", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage static app and model
        run: |
          mkdir -p _site/model
          cp -R web/. _site/
          cp artifacts/neural_onnx/neural_surrogate.onnx _site/model/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
